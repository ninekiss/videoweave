[project]
name = "videoweave-api"
version = "0.0.0"
description = "VideoWeave control plane API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19,<2",
  "boto3>=1.43,<2",
  "fastapi>=0.141,<0.142",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "redis>=8.1,<9",
  "scenedetect-headless>=0.7.1,<0.8",
  "sqlalchemy>=2.0.52,<2.1",
  "uvicorn[standard]>=0.52,<0.53",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoweave_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
